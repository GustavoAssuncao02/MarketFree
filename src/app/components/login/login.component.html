<div class="container">
    <h2 class="text-center mt-5">Preencha os dados abaixo para concluir seu login</h2>
    <div class="row justify-content-center">
        <div class="col-sm-3">
            <form [formGroup]="formLogin" (ngSubmit)="onSubmitLogin()"> 
                <div class="form-group">
                    <label for="emailOuCPF">E-mail ou CPF:</label>
                    <input type="text" id="emailOuCPF" name="emailOuCPF" formControlName="emailOuCPF" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" formControlName="senha" class="form-control" required>
                </div>
                <div class="form-group text-center">
                    <input type="submit" value="Entrar" class="btn btn-primary">
                </div>
            </form>
        </div>
    </div>
</div>
